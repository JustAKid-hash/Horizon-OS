#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Misc options
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# [multilib]
# Include = /etc/pacman.d/mirrorlist

#
# Horizon OS repository. Disabled by default until a mirror is reachable;
# enable it by uncommenting and pointing the mirrorlist at a repository.
#
# [horizon]
# SigLevel = Required DatabaseOptional
# Include = /etc/pacman.d/horizon-mirrorlist
