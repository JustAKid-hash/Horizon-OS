[workspace]
resolver = "2"
members = ["horizon", "horizon-install"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ZeroByte <236030943+JustAKid-hash@users.noreply.github.com>"]
repository = "https://github.com/JustAKid-hash/Horizon-OS"
homepage = "https://github.com/JustAKid-hash/Horizon-OS"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
